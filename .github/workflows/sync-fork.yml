name: 同步上游更新

# 自动把 Devilstore/Glados-Railgun-checkin 的新提交同步到你的 fork。
# 上游会跟进 GLaDOS 的 API 变更（比如 token 从 glados.one 改成 glados.cloud），
# 不同步的话某天签到会突然失效。

on:
  schedule:
    # 每天北京时间 11:17（UTC 03:17）
    # 上游签到跑在北京 9:18 和 12:18，这里卡在两次中间，不会撞车
    - cron: '17 3 * * *'
  workflow_dispatch:   # 也可以手动点一下立即同步

permissions:
  # 关键：默认的 GITHUB_TOKEN 是只读的，不给写权限 push 会失败
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 拉完整历史，否则同步会出问题

      - name: 同步上游
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_sync_repo: Devilstore/Glados-Railgun-checkin   # 上游仓库
          upstream_sync_branch: master                            # 上游分支（注意是 master 不是 main）
          target_sync_branch: master                              # 你 fork 的分支
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          # --ff-only：只在能快进时同步。
          # 如果你改过上游的文件导致冲突，同步会失败并告警，
          # 而不是强行覆盖你的改动 —— 这样更安全。
          upstream_pull_args: --ff-only
          test_mode: false
